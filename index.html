<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LoWorks — Prototype 01</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    height: 64px;
    border-bottom: 1px solid #292929;

    display: flex;
    align-items: center;

    padding: 0 24px;
}

.logo {
    font-size: 21px;
    font-weight: 700;
}

.version {
    margin-left: auto;
    color: #777;
    font-size: 13px;
}

main {
    max-width: 1000px;
    margin: 45px auto;
    padding: 0 25px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.subtitle {
    color: #777;
    margin-top: 8px;
    margin-bottom: 35px;
}

.panel {
    background: #181818;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
}

.panel-title {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 17px;

    background: #fff;
    color: #111;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #ddd;
}

button.dark {
    background: #292929;
    color: #fff;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    margin-left: 12px;

    color: #777;
    font-size: 13px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #555;
}

.status-dot.connected {
    background: #6bcf7f;
}

.workspace {
    min-height: 350px;

    background: #101010;

    border: 1px solid #292929;
    border-radius: 9px;

    padding: 25px;
}

.block {
    width: 290px;

    background: #292929;

    border-radius: 7px;

    padding: 14px 17px;

    margin-bottom: 8px;

    font-family: monospace;
    font-size: 14px;

    cursor: grab;

    border-left: 4px solid #888;
}

.block:hover {
    background: #333;
}

.block.start {
    border-left-color: #fff;
}

.block.control {
    border-left-color: #aaa;
}

.block.action {
    border-left-color: #777;
}

.workspace-empty {
    color: #555;
    font-size: 13px;
    margin-top: 20px;
}

.controls {
    margin-top: 20px;
}

#console {
    background: #0b0b0b;

    border-radius: 7px;

    padding: 14px;

    min-height: 100px;

    color: #777;

    font-family: monospace;
    font-size: 13px;

    white-space: pre-wrap;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        LoWorks
    </div>

    <div class="version">
        Prototype 01
    </div>

</header>


<main>

    <h1>Prototype 01</h1>

    <div class="subtitle">
        Browser-based hardware programming
    </div>


    <!-- DEVICE -->

    <div class="panel">

        <div class="panel-title">
            Device
        </div>

        <button id="connect">
            Connect Arduino
        </button>

        <div class="status">

            <div id="statusDot" class="status-dot"></div>

            <span id="statusText">
                Not connected
            </span>

        </div>

    </div>


    <!-- PROGRAM -->

    <div class="panel">

        <div class="panel-title">
            Program
        </div>


        <div id="workspace" class="workspace">

            <div
                class="block start"
                draggable="true"
                data-command="START"
            >
                WHEN PROGRAM STARTS
            </div>


            <div
                class="block action"
                draggable="true"
                data-command="LED_ON"
            >
                SET LED → ON
            </div>


            <div
                class="block action"
                draggable="true"
                data-command="WAIT 500"
            >
                WAIT → 500 ms
            </div>


            <div
                class="block action"
                draggable="true"
                data-command="LED_OFF"
            >
                SET LED → OFF
            </div>


            <div
                class="block control"
                draggable="true"
                data-command="REPEAT"
            >
                REPEAT FOREVER
            </div>


            <div class="workspace-empty">
                Drag blocks here to build your program.
            </div>

        </div>


        <div class="controls">

            <button id="run">
                Run
            </button>

            <button id="stop" class="dark">
                Stop
            </button>

        </div>

    </div>


    <!-- CONSOLE -->

    <div class="panel">

        <div class="panel-title">
            Console
        </div>

        <div id="console">
            LoWorks ready.
        </div>

    </div>

</main>


<script>

let port = null;
let writer = null;


/* -------------------------
   UI
------------------------- */

const connectButton =
    document.getElementById("connect");

const runButton =
    document.getElementById("run");

const stopButton =
    document.getElementById("stop");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const consoleBox =
    document.getElementById("console");


function log(text) {

    consoleBox.textContent = text;

}


/* -------------------------
   SERIAL
------------------------- */

async function connectArduino() {

    if (!("serial" in navigator)) {

        log(
            "Web Serial is not supported in this browser."
        );

        return;
    }


    try {

        port =
            await navigator.serial.requestPort();


        await port.open({
            baudRate: 115200
        });


        writer =
            port.writable.getWriter();


        statusText.textContent =
            "Connected";

        statusDot.classList.add(
            "connected"
        );


        log(
            "Arduino connected.\n\nLoWorks is ready."
        );

    }

    catch(error) {

        console.error(error);

        log(
            "Connection failed:\n\n" +
            error.message
        );

    }

}


/* -------------------------
   SEND COMMAND
------------------------- */

async function send(command) {

    if (!writer) {

        log(
            "Connect your Arduino first."
        );

        return;
    }


    const data =
        new TextEncoder().encode(
            command + "\n"
        );


    await writer.write(data);

}


/* -------------------------
   RUN
------------------------- */

async function runProgram() {

    if (!writer) {

        log(
            "Connect your Arduino first."
        );

        return;
    }


    log(
        "Running LoWorks program..."
    );


    await send("RUN");

}


/* -------------------------
   STOP
------------------------- */

async function stopProgram() {

    if (!writer) {

        return;
    }


    await send("STOP");


    log(
        "Program stopped."
    );

}


/* -------------------------
   BUTTONS
------------------------- */

connectButton.onclick =
    connectArduino;

runButton.onclick =
    runProgram;

stopButton.onclick =
    stopProgram;


/* -------------------------
   BLOCK DRAGGING
------------------------- */

const blocks =
    document.querySelectorAll(".block");


blocks.forEach(block => {

    block.addEventListener(
        "dragstart",
        event => {

            event.dataTransfer.setData(
                "text/plain",
                block.dataset.command
            );

        }
    );

});


const workspace =
    document.getElementById("workspace");


workspace.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

    }
);


workspace.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        const command =
            event.dataTransfer.getData(
                "text/plain"
            );

        if (!command) return;

        log(
            "Block selected:\n" +
            command
        );

    }
);

</script>

</body>
</html>
