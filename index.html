<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoWorks — Prototype 01</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        header {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .prototype {
            color: #888;
            font-size: 14px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        section {
            background: #191919;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .title {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            color: #aaa;
            font-size: 13px;
        }

        .content {
            padding: 18px;
        }

        button {
            background: #eee;
            color: #111;
            border: none;
            border-radius: 5px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ccc;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            color: #888;
        }

        #status.connected {
            color: #7ee787;
        }

        #status.error {
            color: #ff7b72;
        }

        textarea {
            width: 100%;
            min-height: 320px;
            background: #0d0d0d;
            color: #ddd;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #666;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #serial {
            min-height: 150px;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>LoWorks</h1>
    <div class="prototype">Prototype 01</div>
</header>

<main>

    <!-- DEVICE -->

    <section>
        <div class="title">DEVICE</div>

        <div class="content">

            <button id="connectButton">
                Connect Arduino
            </button>

            <div id="status">
                USB: Not connected
            </div>

        </div>
    </section>


    <!-- CODE -->

    <section>

        <div class="title">CODE</div>

        <div class="content">

<textarea id="code">void setup() {
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(500);

  digitalWrite(LED_BUILTIN, LOW);
  delay(500);
}</textarea>

            <div class="controls">

                <button id="uploadButton">
                    Upload to Board
                </button>

            </div>

        </div>

    </section>


    <!-- SERIAL -->

    <section>

        <div class="title">SERIAL</div>

        <div class="content">

            <div id="serial">
LoWorks ready.
            </div>

        </div>

    </section>

</main>


<script>

let port = null;
let reader = null;

const connectButton =
    document.getElementById("connectButton");

const uploadButton =
    document.getElementById("uploadButton");

const status =
    document.getElementById("status");

const serial =
    document.getElementById("serial");


// --------------------------------
// CONNECT TO ARDUINO
// --------------------------------

connectButton.addEventListener("click", async () => {

    if (!("serial" in navigator)) {

        status.textContent =
            "Web Serial is not supported. Use Chrome or Edge.";

        status.className = "error";

        return;
    }

    try {

        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 115200
        });

        status.textContent =
            "USB: Connected";

        status.className = "connected";

        serial.textContent =
            "LoWorks connected to Arduino.\n";

        connectButton.textContent =
            "Arduino Connected";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "USB: Connection failed";

        status.className = "error";

    }

});


// --------------------------------
// UPLOAD
// --------------------------------

uploadButton.addEventListener("click", async () => {

    const code =
        document.getElementById("code").value;

    serial.textContent =
        "LoWorks Engine: compiling...\n";

    uploadButton.disabled = true;

    try {

        const response = await fetch(
            "http://127.0.0.1:8765/upload",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    code: code
                })
            }
        );

        const result =
            await response.json();


        if (result.success) {

            serial.textContent +=
                "Compilation successful.\n";

            serial.textContent +=
                "Arduino detected.\n";

            serial.textContent +=
                "Uploading...\n";

            serial.textContent +=
                "Upload complete.\n";

            serial.textContent +=
                "Port: " + result.port;

        }

        else {

            serial.textContent +=
                "\nERROR\n";

            serial.textContent +=
                result.error || "Unknown error";

        }

    }

    catch (error) {

        serial.textContent +=
            "\nCould not connect to LoWorks Engine.\n";

        serial.textContent +=
            "Make sure the LoWorks Engine is running.";

        console.error(error);

    }

    uploadButton.disabled = false;

});

</script>

</body>
</html>
