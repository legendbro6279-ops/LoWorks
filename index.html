<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoWorks — Prototype 01</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .prototype {
      margin-left: auto;
      color: #888;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .description {
      color: #888;
      margin-bottom: 35px;
    }

    .panel {
      background: #181818;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 14px;
      color: #888;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button {
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
    }

    button:hover {
      background: #ddd;
    }

    button.secondary {
      background: #292929;
      color: #fff;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
      color: #888;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #555;
    }

    .dot.connected {
      background: #4caf50;
    }

    .blocks {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .block {
      width: fit-content;
      min-width: 250px;
      padding: 14px 18px;
      border-radius: 8px;
      background: #252525;
      border-left: 4px solid #777;
      font-family: monospace;
    }

    .block.repeat {
      border-left-color: #aaa;
    }

    .run-area {
      margin-top: 20px;
    }

    #output {
      margin-top: 18px;
      background: #0b0b0b;
      border-radius: 8px;
      padding: 14px;
      min-height: 90px;
      font-family: monospace;
      font-size: 13px;
      color: #aaa;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">LoWorks</div>
  <div class="prototype">Prototype 01</div>
</header>

<main>

  <h1>Prototype 01</h1>
  <div class="description">
    Browser-based Arduino programming.
  </div>

  <div class="panel">
    <div class="panel-title">Device</div>

    <button id="connectButton">
      Connect Arduino
    </button>

    <span class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Not connected</span>
    </span>
  </div>

  <div class="panel">

    <div class="panel-title">Program</div>

    <div class="blocks">

      <div class="block">
        SET BUILT-IN LED → ON
      </div>

      <div class="block">
        WAIT → 500 ms
      </div>

      <div class="block">
        SET BUILT-IN LED → OFF
      </div>

      <div class="block">
        WAIT → 500 ms
      </div>

      <div class="block repeat">
        REPEAT FOREVER
      </div>

    </div>

    <div class="run-area">
      <button id="runButton">
        Run
      </button>

      <button id="stopButton" class="secondary">
        Stop
      </button>
    </div>

    <div id="output">Waiting...</div>

  </div>

</main>

<script>

let port = null;
let writer = null;

const connectButton = document.getElementById("connectButton");
const runButton = document.getElementById("runButton");
const stopButton = document.getElementById("stopButton");

const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const output = document.getElementById("output");

function log(message) {
  output.textContent = message;
}

async function connectArduino() {

  if (!("serial" in navigator)) {
    log("Web Serial is not supported in this browser.");
    return;
  }

  try {

    port = await navigator.serial.requestPort();

    await port.open({
      baudRate: 115200
    });

    writer = port.writable.getWriter();

    statusText.textContent = "Connected";
    statusDot.classList.add("connected");

    log("Arduino connected.\nReady to run.");

  } catch (error) {

    console.error(error);

    log("Connection failed:\n" + error);

  }
}

async function send(command) {

  if (!writer) {
    log("Connect the Arduino first.");
    return;
  }

  const data = new TextEncoder().encode(command + "\n");

  await writer.write(data);
}

async function runProgram() {

  if (!writer) {
    log("Connect the Arduino first.");
    return;
  }

  log("Running LoWorks program...");

  await send("RUN");

}

async function stopProgram() {

  if (!writer) {
    return;
  }

  await send("STOP");

  log("Program stopped.");

}

connectButton.addEventListener("click", connectArduino);

runButton.addEventListener("click", runProgram);

stopButton.addEventListener("click", stopProgram);

</script>

</body>
</html>
