```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LoWorks — Prototype 01</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #4f7cff;
    --blue-soft: #eaf0ff;

    --purple: #8b63e8;
    --purple-soft: #f0eaff;

    --green: #42b883;
    --green-soft: #e8f8f1;

    --orange: #f39a4a;
    --orange-soft: #fff1e4;

    --pink: #e86b9a;
    --pink-soft: #ffeaf2;

    --yellow: #e8b83f;
    --yellow-soft: #fff8dc;

    --text: #20242b;
    --muted: #7c8490;

    --border: #e7e9ed;

    --shadow:
        0 10px 30px rgba(30, 40, 60, 0.07),
        0 2px 7px rgba(30, 40, 60, 0.04);
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background: #f7f8fa;
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =========================
   TOP BAR
========================= */

header {
    height: 68px;

    display: flex;
    align-items: center;

    padding: 0 30px;

    background: rgba(255,255,255,0.9);

    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(14px);

    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 21px;
    font-weight: 750;

    letter-spacing: -0.4px;
}

.logo-mark {
    width: 29px;
    height: 29px;

    border-radius: 9px;

    background: linear-gradient(
        135deg,
        #4f7cff,
        #8b63e8
    );

    box-shadow:
        0 4px 12px rgba(79,124,255,0.25);

    position: relative;
}

.logo-mark::after {
    content: "";

    width: 8px;
    height: 8px;

    background: white;

    border-radius: 3px;

    position: absolute;

    left: 10px;
    top: 10px;
}

.prototype {
    margin-left: auto;

    font-size: 13px;

    color: var(--muted);

    padding: 7px 11px;

    background: #f4f5f7;

    border: 1px solid var(--border);

    border-radius: 8px;
}


/* =========================
   PAGE
========================= */

main {
    width: min(1080px, calc(100% - 40px));

    margin: 48px auto 80px;
}

.page-title {
    margin-bottom: 30px;

    animation: fadeUp 0.45s ease both;
}

.page-title h1 {
    margin: 0;

    font-size: 35px;

    letter-spacing: -1.2px;
}

.page-title p {
    margin: 9px 0 0;

    color: var(--muted);

    font-size: 15px;
}


/* =========================
   PANELS
========================= */

.panel {
    background: white;

    border: 1px solid var(--border);

    border-radius: 17px;

    padding: 22px;

    margin-bottom: 18px;

    box-shadow: var(--shadow);

    animation: fadeUp 0.5s ease both;
}

.panel:nth-child(2) {
    animation-delay: 0.05s;
}

.panel:nth-child(3) {
    animation-delay: 0.1s;
}

.panel-title {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 13px;
    font-weight: 700;

    color: #505761;

    margin-bottom: 17px;
}

.panel-title-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--blue);
}


/* =========================
   DEVICE
========================= */

.device-row {
    display: flex;
    align-items: center;
    gap: 13px;

    flex-wrap: wrap;
}

button {
    border: 0;

    border-radius: 10px;

    padding: 11px 17px;

    font-family: inherit;

    font-size: 14px;
    font-weight: 650;

    cursor: pointer;

    transition:
        transform 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
}

button:hover {
    transform: translateY(-1px);
}

button:active {
    transform: translateY(1px) scale(0.98);
}

.primary {
    color: white;

    background: linear-gradient(
        135deg,
        #4f7cff,
        #657fff
    );

    box-shadow:
        0 6px 15px rgba(79,124,255,0.22);
}

.primary:hover {
    box-shadow:
        0 8px 19px rgba(79,124,255,0.29);
}

.secondary {
    background: #f1f3f6;
    color: #4d535c;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--muted);

    font-size: 13px;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #c5cad1;

    transition:
        background 0.3s ease,
        box-shadow 0.3s ease;
}

.status-dot.connected {
    background: var(--green);

    box-shadow:
        0 0 0 4px rgba(66,184,131,0.12);
}


/* =========================
   WORKSPACE
========================= */

.workspace {
    min-height: 390px;

    padding: 26px;

    border-radius: 13px;

    background:
        radial-gradient(
            circle at 20px 20px,
            #edf0f4 1.2px,
            transparent 1.2px
        );

    background-size: 22px 22px;

    border: 1px solid #e9ebef;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.workspace.drag-active {
    border-color: #9db4ff;

    box-shadow:
        inset 0 0 0 2px rgba(79,124,255,0.08);
}


/* =========================
   BLOCKS
========================= */

.block {
    width: 315px;

    min-height: 53px;

    display: flex;
    align-items: center;

    padding: 13px 17px;

    margin-bottom: 9px;

    border-radius: 11px;

    color: white;

    font-size: 14px;
    font-weight: 650;

    cursor: grab;

    box-shadow:
        0 5px 12px rgba(30,40,60,0.09);

    user-select: none;

    transition:
        transform 0.18s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.18s ease,
        filter 0.18s ease;
}

.block:hover {
    transform: translateX(4px);

    box-shadow:
        0 8px 17px rgba(30,40,60,0.13);

    filter: brightness(1.025);
}

.block:active {
    cursor: grabbing;

    transform: scale(0.985);
}

.block.start {
    background:
        linear-gradient(
            135deg,
            #667eea,
            #7b68ee
        );
}

.block.action-blue {
    background:
        linear-gradient(
            135deg,
            #4f7cff,
            #5d8cff
        );
}

.block.action-green {
    background:
        linear-gradient(
            135deg,
            #36ad7b,
            #4fc58f
        );
}

.block.action-orange {
    background:
        linear-gradient(
            135deg,
            #ee9140,
            #f5a35a
        );
}

.block.control {
    background:
        linear-gradient(
            135deg,
            #e45f8f,
            #ed77a0
        );
}

.block-icon {
    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 11px;

    border-radius: 8px;

    background: rgba(255,255,255,0.18);

    font-size: 13px;
}

.block-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.block-label {
    font-size: 13px;
}

.block-detail {
    font-size: 11px;
    font-weight: 500;

    opacity: 0.75;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;

    gap: 9px;

    margin-top: 19px;
}

.run {
    background: #20242b;
    color: white;

    padding-left: 21px;
    padding-right: 21px;
}

.run:hover {
    background: #30353d;
}


/* =========================
   CONSOLE
========================= */

.console {
    background: #f7f8fa;

    border: 1px solid #e7e9ed;

    border-radius: 10px;

    padding: 15px;

    min-height: 90px;

    color: #707783;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 12px;

    line-height: 1.7;

    white-space: pre-wrap;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 650px) {

    header {
        padding: 0 18px;
    }

    main {
        width: calc(100% - 24px);

        margin-top: 30px;
    }

    .page-title h1 {
        font-size: 29px;
    }

    .workspace {
        padding: 17px;
    }

    .block {
        width: 100%;
    }

}
</style>
</head>

<header>

    <div class="logo">

        <div class="logo-mark"></div>

        LoWorks

    </div>

    <div class="prototype">
        Prototype 01
    </div>

</header>


<main>


    <div class="page-title">

        <h1>Build something.</h1>

        <p>
            Program your hardware without leaving LoWorks.
        </p>

    </div>


    <!-- DEVICE -->

    <div class="panel">

        <div class="panel-title">

            <span class="panel-title-dot"></span>

        </div>


        <div class="device-row">

            <button
                id="connect"
                class="primary"
            >
                Connect Arduino
            </button>


            <div class="status">

                <div
                    id="statusDot"
                    class="status-dot"
                ></div>

                <span id="statusText">

```
